name: Claude Code

# Responde a menciones de @claude en issues, comentarios y revisiones de PR.
# Requiere el secreto ANTHROPIC_API_KEY en Settings → Secrets and variables → Actions.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout
        # actions/checkout@v6 fijado por SHA: una etiqueta puede reapuntarse.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 1

      - name: Claude Code
        # anthropics/claude-code-action@v1 fijado por SHA del commit (v1^{}).
        uses: anthropics/claude-code-action@5ee796a55f92566ecd7e39d70dd613abcbea0d7c
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Sin allowed_bots ni allowed_non_write_users: solo actúa para quien
          # tiene permiso de escritura en el repositorio.
